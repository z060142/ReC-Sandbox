# Shipped bakes, one table per output file.
#
# Display and view strings are the ones printed by `uv run list_config.py` against
# ocio://studio-config-latest (= studio-config-v4.0.0_aces-v2.0_ocio-v2.5, PyOpenColorIO 2.5.2).
# Do not edit them from memory -- re-run list_config.py and copy what it prints.
#
# `out` may contain "{size}"; otherwise, when several sizes are baked, the size is appended
# to the stem.

[odt_srgb_100nit]
title       = "ACES 2.0 SDR 100nit sRGB display, ACEScct in"
kind        = "odt"
config      = "ocio://studio-config-latest"
input_space = "ACEScct"
display     = "sRGB - Display"
view        = "ACES 2.0 - SDR 100 nits (Rec.709)"
sizes       = [33, 65]
out         = "odt_srgb_100nit_aces2_{size}.cube"
notes = [
  "Default ODT. Ends in the piecewise sRGB encode, which is what an 8-bit non-sRGB-typed",
  "swapchain on a desktop monitor wants (decisions/s4-display-transform.md section 3A).",
]

[odt_rec1886_100nit]
title       = "ACES 2.0 SDR 100nit Rec.1886 Rec.709 display, ACEScct in"
kind        = "odt"
config      = "ocio://studio-config-latest"
input_space = "ACEScct"
display     = "Rec.1886 Rec.709 - Display"
view        = "ACES 2.0 - SDR 100 nits (Rec.709)"
sizes       = [33]
out         = "odt_rec1886_100nit_aces2_{size}.cube"
notes = [
  "Same output transform as odt_srgb_100nit, differing only in the final inverse EOTF",
  "(pure 2.4 gamma instead of the piecewise sRGB curve). This is the reference for the",
  "Resolve round-trip comparison (D12), whose default viewer path is Rec.1886.",
]

[lmt_identity]
title       = "Identity LMT, ACEScct in / ACEScct out"
kind        = "identity"
input_space = "ACEScct"
size        = 33
out         = "lmt_identity_33.cube"
